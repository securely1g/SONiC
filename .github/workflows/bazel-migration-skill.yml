name: Bazel migration skill

on:
  pull_request:
    paths:
      - "doc/bazel/sonic-bazel-migration/**"
      - ".github/workflows/bazel-migration-skill.yml"
  push:
    branches: [master]
    paths:
      - "doc/bazel/sonic-bazel-migration/**"
      - ".github/workflows/bazel-migration-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-migration-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Skill tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test dashboard formatting and dependency ordering
        run: python -m unittest discover -s doc/bazel/sonic-bazel-migration/scripts -p 'test_*.py' -v
